[project]
name = "math-lab"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jake Van Slyke", email = "jakervanslyke@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "ipykernel>=7.4.0",
    "jupyter>=1.1.1",
    "mpmath>=1.3.0",
    "numpy>=2.5.3",
    "scipy>=1.18.1",
    "sympy>=1.14.0",
]

[project.scripts]
math-lab = "math_lab:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"
